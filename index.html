*{

/* AGGRESSIVE BODY LOCK: the body must NEVER scroll or bounce on Android Chrome.
   Only the song-list containers (marked [data-scroll-list]) scroll. */

html, body{
  margin:0;
  height:100%;
  height:100dvh;
  overflow:hidden;
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  overscroll-behavior:none;
  overscroll-behavior-y:none;
  overscroll-behavior-x:none;
  touch-action:pan-y;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  -moz-user-select:none;
       user-select:none;
  background:#0A1128;
  color:#fff;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;
}

/* While any sheet is open: html { height: 100dvh; }, body { position: fixed; overflow: hidden; }
   so Chrome Android cannot push the sheet under the keyboard. */

html.sheet-open, body.sheet-open{
  height:100dvh;
  position:fixed;
  overflow:hidden;
}

/* Song rows must never become selectable text, especially on Android
   long-press. The 3-dot handle is the only long-press target. */

[data-song-row],
[data-song-row] *,
[data-drag-handle]{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  -moz-user-select:none;
       user-select:none;
}

[data-safe-area-inset-root]{
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  overscroll-behavior:none;
  overscroll-behavior-y:none;
  touch-action:pan-y;
}

/* ONLY the song lists scroll. Contain overscroll so it never propagates to the body. */

[data-scroll-list]{
  overflow-y:auto;
  overscroll-behavior:contain;
  overscroll-behavior-y:contain;
  overscroll-behavior-x:none;
  -webkit-overflow-scrolling:touch;
  flex:1 1 auto;
  min-height:0;
}

/* Dialog / sheet scrollers also contain overscroll — no rubber-band leaks to the body. */

.overflow-y-auto, .overflow-auto{
  overscroll-behavior:contain;
  overscroll-behavior-y:contain;
  overscroll-behavior-x:none;
  -webkit-overflow-scrolling:touch;
}
